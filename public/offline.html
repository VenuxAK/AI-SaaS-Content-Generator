<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Offline - AI SaaS Content Generator</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png">
    <style>
        :root {
            --bg: #07080e;
            --card-bg: rgba(18, 20, 32, 0.85);
            --border: rgba(99, 102, 241, 0.2);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --badge-bg: rgba(99, 102, 241, 0.12);
            --badge-text: #a5b4fc;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f8fafc;
                --card-bg: rgba(255, 255, 255, 0.95);
                --border: rgba(99, 102, 241, 0.15);
                --text-primary: #0f172a;
                --text-secondary: #64748b;
                --badge-bg: rgba(99, 102, 241, 0.08);
                --badge-text: #4f46e5;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Glow */
        .ambient-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(99, 102, 241, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.75rem 2rem;
            max-width: 440px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
        }

        .logo-wrap {
            margin: 0 auto 1.5rem auto;
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.25);
        }

        .logo-wrap img {
            width: 44px;
            height: 44px;
            object-fit: contain;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            margin-bottom: 1.25rem;
            border: 1px solid var(--border);
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #f59e0b;
            box-shadow: 0 0 8px #f59e0b;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 0.925rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: var(--accent);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.875rem 1.5rem;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
        }

        .btn-retry:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px 0 rgba(99, 102, 241, 0.5);
        }

        .btn-retry:active {
            transform: translateY(0);
        }

        .btn-retry svg {
            transition: transform 0.5s ease;
        }

        .btn-retry.spinning svg {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .status-footer {
            margin-top: 1.5rem;
            font-size: 0.775rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="card">
        <div class="logo-wrap">
            <img src="/icons/icon-192x192.png" alt="App Icon">
        </div>
        
        <div class="badge">
            <span class="badge-dot"></span>
            Offline Mode
        </div>

        <h1>You're Currently Offline</h1>
        <p>It looks like your internet connection is unavailable. Don't worry, your offline shell is active. Reconnect to generate new AI content.</p>

        <button class="btn-retry" id="retryBtn" onclick="handleRetry()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                <path d="M21 3v5h-5"></path>
                <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
                <path d="M3 21v-5h5"></path>
            </svg>
            <span>Retry Connection</span>
        </button>

        <div class="status-footer" id="statusText">
            Auto-reconnecting when internet is restored...
        </div>
    </div>

    <script>
        function handleRetry() {
            const btn = document.getElementById('retryBtn');
            const status = document.getElementById('statusText');
            btn.classList.add('spinning');
            status.textContent = 'Checking connection...';

            fetch('/manifest.webmanifest', { cache: 'no-store', method: 'HEAD' })
                .then(() => {
                    window.location.reload();
                })
                .catch(() => {
                    setTimeout(() => {
                        btn.classList.remove('spinning');
                        status.textContent = 'Still offline. Please check your Wi-Fi or cellular network.';
                    }, 600);
                });
        }

        window.addEventListener('online', () => {
            document.getElementById('statusText').textContent = 'Connection detected! Reloading...';
            setTimeout(() => {
                window.location.reload();
            }, 500);
        });
    </script>
</body>
</html>
